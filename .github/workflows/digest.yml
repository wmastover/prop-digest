name: Property Morning Digest

on:
  schedule:
    # 05:30 UTC, Mon-Fri. Change to "30 4 * * 1-5" when UK clocks go forward (BST).
    - cron: "30 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # OpenRouter account has no credit, so Sonnet 402s. Remove this line once credits are added to go back to Sonnet.
          DIGEST_MODEL: anthropic/claude-haiku-5.5
        run: python digest.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ property-digest-agent.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "digest: update state [skip ci]"
            git push
          fi
