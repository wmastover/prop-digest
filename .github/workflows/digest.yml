name: Property Morning Digest

on:
  schedule:
    # GitHub can delay or silently drop scheduled runs, so there is a backup slot; the guard
    # step below makes the second one a no-op if the first already sent today's digest.
    # Off-the-hour minutes avoid GitHub's busiest times. Subtract an hour from both when UK
    # clocks go forward (BST).
    - cron: "17 5 * * 1-5"
    - cron: "47 6 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/digest.yml]

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's digest already went out
        id: guard
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p = Path("state/last_run.txt")
          uk = ZoneInfo("Europe/London")
          last = p.read_text().strip() if p.exists() else ""
          done = bool(last) and datetime.fromisoformat(last).astimezone(uk).date() == datetime.now(timezone.utc).astimezone(uk).date()
          print(f"skip={'true' if done else 'false'}")
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'

      - name: Run digest
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # OpenRouter account has no credit, so Sonnet 402s. Remove this line once credits are added to go back to Sonnet.
          DIGEST_MODEL: anthropic/claude-haiku-5.5
        run: python digest.py

      - name: Commit state
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ property-digest-agent.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "digest: update state [skip ci]"
            git push
          fi
